<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Patchvane &mdash; upstream patch tracker</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%234c8dff'/><path d='M8 22h16' stroke='white' stroke-width='2.6' stroke-linecap='round'/><path d='M11 22c0-6 4-8 9-8' stroke='%23a5d6ff' stroke-width='2.6' fill='none' stroke-linecap='round'/><circle cx='24' cy='11' r='3' fill='white'/></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- The sidebar is fifty tab stops and it is in front of the content on
     every view, so without this a keyboard gets through it once per page
     and then does it again. -->
<a class="skip" href="#view">Skip to content</a>

<!-- Behind everything, and empty unless somebody chose a wallpaper in
     Settings. Decorative: there is nothing here to announce. -->
<div id="wall" aria-hidden="true"></div>

<div id="bar" class="barload"></div>

<div class="shell">
  <aside class="sidebar">
    <div class="logo">
        <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="9" fill="url(#lg)"/>
          <path d="M7 23h18" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>
          <path class="climb" d="M11 23c0-7 4-9 10-9" stroke="#bcd9ff"
                stroke-width="2.6" fill="none" stroke-linecap="round"/>
          <circle class="landed" cx="24" cy="10" r="4.6" fill="#fff"
                  filter="url(#lgsoft)"/>
          <circle cx="24" cy="10" r="3.2" fill="#fff"/>
          <defs>
            <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#4c8dff"/><stop offset="1" stop-color="#2dd4bf"/>
            </linearGradient>
            <filter id="lgsoft" x="-60%" y="-60%" width="220%" height="220%">
              <feGaussianBlur stdDeviation="1.5"/>
            </filter>
          </defs>
        </svg>
      <span class="wordmark">Patchvane<i>upstream patch tracker</i></span>
    </div>

    <nav id="nav"></nav>
  </aside>

  <div class="app">
    <header class="topbar">
      <div class="ttl">
        <h1 id="viewtitle">Overview</h1>
        <p id="viewsub"></p>
      </div>
      <div class="spacer"></div>

      <div class="stamp">
        <span class="dot live" id="live"></span>
        <span>
          <b id="stamp">&mdash;</b>
          <i id="stampsub"></i>
          <span class="minibar" id="minibar" hidden
                role="progressbar" aria-valuemin="0" aria-valuemax="100">
            <span class="track"><span class="fill" id="minifill"></span></span>
            <span class="pct" id="minipct"></span>
          </span>
        </span>
      </div>

      <!-- Drawn rather than set in a glyph so the two states can be the
           same shape moving: the arrow turns through the collection, and
           the moon opens into a sun.  Both are decorative -- the button
           says what it does. -->
      <button class="iconbtn cyc" id="refresh" title="Collect fresh data"
              aria-label="Collect fresh data">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path class="ring" d="M20.5 12a8.5 8.5 0 1 1-2.49-6.01"/>
          <path class="tip" d="M20.5 3.5v5h-5"/>
        </svg>
      </button>
      <button class="iconbtn sunmoon" id="theme" title="Switch theme"
              aria-label="Switch theme">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <mask id="bite">
            <rect x="0" y="0" width="24" height="24" fill="#fff"/>
            <circle class="bit" cx="18" cy="7" r="8" fill="#000"/>
          </mask>
          <circle class="orb" cx="12" cy="12" r="9" mask="url(#bite)"/>
          <g class="rays">
            <line x1="12" y1="1.6" x2="12" y2="4.2"/>
            <line x1="12" y1="19.8" x2="12" y2="22.4"/>
            <line x1="1.6" y1="12" x2="4.2" y2="12"/>
            <line x1="19.8" y1="12" x2="22.4" y2="12"/>
            <line x1="4.6" y1="4.6" x2="6.4" y2="6.4"/>
            <line x1="17.6" y1="17.6" x2="19.4" y2="19.4"/>
            <line x1="4.6" y1="19.4" x2="6.4" y2="17.6"/>
            <line x1="17.6" y1="6.4" x2="19.4" y2="4.6"/>
          </g>
        </svg>
      </button>
      <button class="aibtn" id="aibtn" title="Ask the assistant">
        <span class="sparkle">&#10022;</span><span class="btnlb">Ask AI</span></button>

      <div class="usermenu">
        <button class="who" id="whobtn" title="Account"
                aria-haspopup="true" aria-expanded="false">
          <span class="avatar" id="avatar">&nbsp;</span>
          <!-- On the picture rather than beside it: this is the only part
               of the account button small screens keep. -->
          <span class="nbadge hidden" id="nbadge"></span>
          <span id="userlabel" class="uname">&mdash;</span>
          <span class="dots">&#8942;</span>
        </button>
        <div class="whomenu hidden" id="whomenu" role="menu">
          <!-- All four carry one, so the labels line up.  Drawn, like the
               two buttons in the header: the glyphs for these are the sort
               that render as a box on a machine without the font. -->
          <button role="menuitem" data-who="notices">
            <svg class="mi" viewBox="0 0 24 24" aria-hidden="true"
                 focusable="false">
              <path d="M18 8.5a6 6 0 1 0-12 0c0 5-2 6.5-2 6.5h16s-2-1.5-2-6.5"/>
              <path d="M13.7 19a2 2 0 0 1-3.4 0"/>
            </svg>Notifications
            <span class="ntag hidden" id="ntag"></span>
          </button>
          <button role="menuitem" data-who="profile">
            <svg class="mi" viewBox="0 0 24 24" aria-hidden="true"
                 focusable="false">
              <circle cx="12" cy="8.2" r="3.6"/>
              <path d="M4.8 20a7.2 7.2 0 0 1 14.4 0"/>
            </svg>Profile</button>
          <button role="menuitem" data-who="settings">
            <svg class="mi" viewBox="0 0 24 24" aria-hidden="true"
                 focusable="false">
              <!-- Sliders, not a cog: a cog at this size is a smudge, and
                   the spoked circle that reads well is the sun on the
                   button two along from here. -->
              <path d="M4 7h10M18 7h2M4 12h3M11 12h9M4 17h8M16 17h4"/>
              <circle cx="16" cy="7" r="2"/>
              <circle cx="9" cy="12" r="2"/>
              <circle cx="14" cy="17" r="2"/>
            </svg>Settings</button>
          <button role="menuitem" data-who="signout">
            <svg class="mi" viewBox="0 0 24 24" aria-hidden="true"
                 focusable="false">
              <path d="M14.5 4.2H19a1 1 0 0 1 1 1v13.6a1 1 0 0 1-1 1h-4.5"/>
              <path d="M10.2 8.2 14 12l-3.8 3.8M14 12H4"/>
            </svg>Sign out</button>
        </div>
        <!-- Hangs off the same corner as the account menu and is filled in
             when it is opened: this is a list that changes between one
             opening and the next, so there is nothing to put here. -->
        <div class="noticebox hidden" id="noticebox" role="dialog"
             aria-label="Notifications"></div>
      </div>
    </header>

    <main class="content" id="view">
      <div class="skeleton">
        <div class="sk sk-hero"></div>
        <div class="sk-row">
          <div class="sk sk-card"></div><div class="sk sk-card"></div>
          <div class="sk sk-card"></div><div class="sk sk-card"></div>
        </div>
        <div class="sk sk-wide"></div>
      </div>
    </main>
  </div>
</div>

<!-- assistant -->
<div id="aiscrim" class="scrim"></div>
<aside id="ai" class="drawer">
  <header>
    <span class="aimark">&#10022;</span>
    <div><h2>Assistant</h2><p>grounded in what this dashboard collected</p></div>
    <div class="spacer"></div>
    <!-- An anticlockwise arrow rather than a clock face: the clock faces are
         all in the emoji block, and a machine without an emoji font draws a
         box where the button should be. -->
    <button class="iconbtn" id="aipast" title="Earlier conversations"
            aria-expanded="false">&#10226;</button>
    <button class="iconbtn" id="ainew" title="New chat">&#10133;</button>
    <button class="iconbtn" id="aiclose" title="Close (Esc)">&times;</button>
  </header>
  <div id="aihist" class="aihist hidden"></div>
  <div id="aichat" class="aichat"></div>
  <div class="aiform">
    <div id="aipicker" class="aipicker"></div>
    <div class="airow">
      <!-- A placeholder is not a label: it is gone the moment anything is
           typed, and some readers never announce it at all. -->
      <textarea id="aiinput" rows="1" aria-label="Ask about your patches"
                placeholder="Ask about your patches"></textarea>
      <button id="aisend" class="btn primary" title="Send (Enter)">&#10148;</button>
    </div>
  </div>
</aside>

<!-- one patch, in full -->
<div id="thscrim" class="scrim"></div>
<aside id="thread" class="drawer wide">
  <header>
    <span class="aimark">&#9993;</span>
    <div><h2 id="thtitle">Patch</h2><p id="thsub">the whole conversation</p></div>
    <div class="spacer"></div>
    <a id="thlore" class="btn ghost sm" target="_blank" rel="noreferrer">Open in lore</a>
    <button class="iconbtn" id="thclose" title="Close (Esc)">&times;</button>
  </header>
  <div id="thbody" class="thbody"></div>
</aside>

<!-- Toasts are the only confirmation that a save, an export or a failed
     request happened at all, and a screen reader was never told about any
     of them.  polite rather than assertive: they are worth hearing, not
     worth cutting somebody off mid-sentence. -->
<div id="toast" role="status" aria-live="polite" aria-atomic="false"></div>

<script src="ui.js"></script>
<script src="help.js"></script>
<script src="app.js"></script>
</body>
</html>
